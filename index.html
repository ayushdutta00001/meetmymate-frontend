<!DOCTYPE html>
<html lang="en">
 <head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>MEET MY MATE IN</title>

  <meta
    name="description"
    content="MEET MY MATE IN — Book People. Save Time."
  />

  <meta
    name="robots"
    content="index, follow"
  />

  <link
    rel="canonical"
    href="https://www.meetmymatein.com/"
  />

  <!-- Google site name -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebSite",
    "name": "MEET MY MATE IN",
    "alternateName": "Meet My Mate In",
    "url": "https://www.meetmymatein.com/"
  }
  </script>

  <!-- Organization -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Organization",
    "name": "MEET MY MATE IN",
    "url": "https://www.meetmymatein.com/"
  }
  </script>
</head>

  <body>
    <div id="root"></div>

    <script>
      /*
       * MeetMyMate is permanently dark.
       * Force the dark class before React starts.
       */
      (function () {
        const forceDarkMode = () => {
          document.documentElement.classList.add("dark");
          document.documentElement.style.colorScheme = "dark";
        };

        forceDarkMode();

        /*
         * Keep dark mode active even if another part of the
         * application tries to remove the "dark" class.
         */
        const observer = new MutationObserver(() => {
          if (
            !document.documentElement.classList.contains("dark")
          ) {
            forceDarkMode();
          }

          if (
            document.documentElement.style.colorScheme !== "dark"
          ) {
            document.documentElement.style.colorScheme = "dark";
          }
        });

        observer.observe(document.documentElement, {
          attributes: true,
          attributeFilter: ["class", "style"],
        });
      })();
    </script>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
