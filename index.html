<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>MeetmyMate</title>
  </head>

  <body>
    <div id="root"></div>

    <script>
      /*
       * MeetMyMate is permanently dark.
       * Force the dark class before React starts.
       */
      (function () {
        const forceDarkMode = () => {
          document.documentElement.classList.add("dark");
          document.documentElement.style.colorScheme = "dark";
        };

        forceDarkMode();

        /*
         * Keep dark mode active even if another part of the
         * application tries to remove the "dark" class.
         */
        const observer = new MutationObserver(() => {
          if (
            !document.documentElement.classList.contains("dark")
          ) {
            forceDarkMode();
          }

          if (
            document.documentElement.style.colorScheme !== "dark"
          ) {
            document.documentElement.style.colorScheme = "dark";
          }
        });

        observer.observe(document.documentElement, {
          attributes: true,
          attributeFilter: ["class", "style"],
        });
      })();
    </script>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
